<p-card header="Leave History">
    <p-table
        [value]="leaveHistory"
        [tableStyle]="{ 'min-width': '60rem' }"
        stripedRows
        responsiveLayout="scroll">

        <!-- Header -->
        <ng-template #header>

            <tr>
                <th>Employee ID</th>
                <th>Employee Name</th>
                <th>Leave Type</th>
                <th>From Date</th>
                <th>To Date</th>
                <th>Total Days</th>
                <th>Reason</th>
                <th>Status</th>
            </tr>

        </ng-template>


        <!-- Body -->
        <ng-template #body let-row>

            <tr>

                <td>
                    EMP{{ row.employee_id | number:'3.0-0' }}
                </td>

                <td>
                    {{ row.employee_name }}
                </td>

                <td>
                    {{ row.leave_name }}
                </td>

                <td>
                    {{ row.from_date }}
                </td>

                <td>
                    {{ row.to_date }}
                </td>

                <td>
                    {{ row.total_days }}
                </td>

                <td>
                    {{ row.reason }}
                </td>

                <td>

                    <p-button
                        [label]="row.status"
                        [severity]="
                            row.status === 'Approved'
                                ? 'success'
                                : row.status === 'Pending'
                                ? 'warn'
                                : 'danger'
                        "
                        [outlined]="true"
                        (onClick)="showStatus(row)">
                    </p-button>

                </td>

            </tr>

        </ng-template>


        <!-- Empty Message -->
        <ng-template #emptymessage>

            <tr>

                <td colspan="8">
                    No Leave History Found
                </td>

            </tr>

        </ng-template>

    </p-table>
</p-card>
