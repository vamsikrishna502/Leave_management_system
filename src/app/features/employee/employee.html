<div class="employee-container">

    <h1>Employees Details</h1>

    <div class="table-responsive">

        <table class="employee-table">

            <thead>
                <tr>
                    <th>ID</th>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Email</th>
                </tr>
            </thead>

          
        <tbody>
            @for (emp of employees; track emp.employee_id) {
                <tr>
                <td>{{ emp.employee_id}}</td>
                <td>{{ emp.first_name }}</td>
                <td>{{ emp.last_name }}</td>
                <td>{{ emp.email }}</td>
                </tr>
            }
            </tbody>

        
        </table>

    </div>

</div>
